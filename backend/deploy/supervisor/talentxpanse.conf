[program:talentxpanse-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/talentxpanse/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/talentxpanse/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/talentxpanse/backend/storage/logs/queue-worker.log
stopwaitsecs=120

[program:talentxpanse-scheduler]
command=/usr/bin/php /var/www/talentxpanse/backend/artisan schedule:work
directory=/var/www/talentxpanse/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/talentxpanse/backend/storage/logs/scheduler.log

[program:talentxpanse-reverb]
command=/usr/bin/php /var/www/talentxpanse/backend/artisan reverb:start
directory=/var/www/talentxpanse/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/talentxpanse/backend/storage/logs/reverb.log
