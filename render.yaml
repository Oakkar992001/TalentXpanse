services:
  - type: web
    name: talentxpanse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    rootDir: backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: QUEUE_AFTER_COMMIT
        value: true
      - key: BROADCAST_CONNECTION
        value: log
      - key: MARKETPLACE_PAYMENTS_ENABLED
        value: false
      - key: MARKETPLACE_EMAIL_NOTIFICATIONS_ENABLED
        value: false
      - key: MARKETPLACE_PRIVATE_FILESYSTEM_DISK
        value: marketplace_private
      - key: MARKETPLACE_PUBLIC_FILESYSTEM_DISK
        value: marketplace_public
      - key: MARKETPLACE_REQUIRE_EXTERNAL_STORAGE
        value: true
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_URL
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_NAME
        value: TalentXpanse
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPEN_BETA_ADMIN_NAME
        value: TalentXpanse Administrator
      - key: OPEN_BETA_ADMIN_EMAIL
        sync: false
      - key: OPEN_BETA_ADMIN_PASSWORD
        sync: false
      - key: MARKETPLACE_PRIVATE_AWS_ACCESS_KEY_ID
        sync: false
      - key: MARKETPLACE_PRIVATE_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MARKETPLACE_PRIVATE_AWS_DEFAULT_REGION
        value: ap-southeast-1
      - key: MARKETPLACE_PRIVATE_AWS_BUCKET
        sync: false
      - key: MARKETPLACE_PRIVATE_AWS_ENDPOINT
        sync: false
      - key: MARKETPLACE_PRIVATE_AWS_USE_PATH_STYLE_ENDPOINT
        value: true
      - key: MARKETPLACE_PUBLIC_AWS_ACCESS_KEY_ID
        sync: false
      - key: MARKETPLACE_PUBLIC_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MARKETPLACE_PUBLIC_AWS_DEFAULT_REGION
        value: ap-southeast-1
      - key: MARKETPLACE_PUBLIC_AWS_BUCKET
        sync: false
      - key: MARKETPLACE_PUBLIC_AWS_URL
        sync: false
      - key: MARKETPLACE_PUBLIC_AWS_ENDPOINT
        sync: false
      - key: MARKETPLACE_PUBLIC_AWS_USE_PATH_STYLE_ENDPOINT
        value: true
